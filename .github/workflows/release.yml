  # ==========================================================================
  # NOTIFICATION: Release completion notifications and status updates
  # ==========================================================================
  notify_release:
    name: "Release Completion Notifications"
    runs-on: ubuntu-latest
    needs: [validate_release, create_release, deploy_staging, deploy_production]
    if: always() && (needs.deploy_staging.result == 'success' || needs.deploy_production.result == 'success' || needs.deploy_staging.result == 'skipped' || needs.deploy_production.result == 'skipped')
    timeout-minutes: 5
    
    steps:
      - name: "📊 Generate Release Summary Report"
        run: |
          echo "📊 Node.js Tutorial Release Summary Report"
          echo "=========================================="
          echo ""
          echo "🎯 Release Information"
          echo "  Version: ${{ needs.validate_release.outputs.release-version }}"
          echo "  Pre-release: ${{ needs.validate_release.outputs.is-prerelease }}"
          echo "  Release ID: ${{ needs.create_release.outputs.release-id }}"
          echo "  Release URL: ${{ needs.create_release.outputs.release-url }}"
          echo ""
          echo "📦 Artifacts"
          echo "  Application Archive: nodejs-tutorial-backend-${{ needs.validate_release.outputs.release-version }}.tar.gz"
          echo "  Container Images: ${{ env.IMAGE_NAME }}:${{ needs.validate_release.outputs.release-version }}"
          echo "  Platforms: linux/amd64, linux/arm64"
          echo ""
          echo "🚀 Deployment Status"
          echo "  Staging: ${{ needs.deploy_staging.result }}"
          echo "  Production: ${{ needs.deploy_production.result }}"
          echo ""
          echo "🔗 Access URLs"
          if [[ "${{ needs.deploy_staging.result }}" == "success" ]]; then
            echo "  Staging: https://staging.nodejs-tutorial.com"
          fi
          if [[ "${{ needs.deploy_production.result }}" == "success" ]]; then
            echo "  Production: https://nodejs-tutorial.com"
          fi
          echo ""
          echo "📈 Technical Details"
          echo "  Node.js: 24.x LTS"
          echo "  Express.js: 5.1.0"
          echo "  TypeScript: Latest stable"
          echo "  Security: Helmet.js, CORS, Rate limiting"
          echo "  Container: Multi-architecture Docker images"
          echo ""
          echo "✅ Release completed successfully!"
      
      - name: "📧 Send Slack Release Notification"
        if: secrets.SLACK_WEBHOOK != ''
        run: |
          echo "📧 Sending Slack notification for release completion..."
          
          # Determine deployment status emoji
          if [[ "${{ needs.deploy_production.result }}" == "success" ]]; then
            DEPLOYMENT_EMOJI="🌟"
            DEPLOYMENT_TEXT="Production deployment successful!"
            ENVIRONMENT="Production"
            URL="https://nodejs-tutorial.com"
          elif [[ "${{ needs.deploy_staging.result }}" == "success" ]]; then
            DEPLOYMENT_EMOJI="🚧"
            DEPLOYMENT_TEXT="Staging deployment successful!"
            ENVIRONMENT="Staging"
            URL="https://staging.nodejs-tutorial.com"
          else
            DEPLOYMENT_EMOJI="📦"
            DEPLOYMENT_TEXT="Release created, deployment pending."
            ENVIRONMENT="N/A"
            URL="N/A"
          fi
          
          # Create Slack message payload
          SLACK_MESSAGE="{
            \"text\": \"$DEPLOYMENT_EMOJI Node.js Tutorial Release v${{ needs.validate_release.outputs.release-version }}\",
            \"blocks\": [
              {
                \"type\": \"header\",
                \"text\": {
                  \"type\": \"plain_text\",
                  \"text\": \"$DEPLOYMENT_EMOJI Node.js Tutorial Release v${{ needs.validate_release.outputs.release-version }}\"
                }
              },
              {
                \"type\": \"section\",
                \"fields\": [
                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Version:*\n${{ needs.validate_release.outputs.release-version }}\"
                  },
                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Environment:*\n$ENVIRONMENT\"
                  },
                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*Status:*\n$DEPLOYMENT_TEXT\"
                  },
                  {
                    \"type\": \"mrkdwn\",
                    \"text\": \"*URL:*\n$URL\"
                  }
                ]
              },
              {
                \"type\": \"section\",
                \"text\": {
                  \"type\": \"mrkdwn\",
                  \"text\": \"🔗 <${{ needs.create_release.outputs.release-url }}|View Release Notes> | 🐳 \\\`docker pull ${{ env.IMAGE_NAME }}:${{ needs.validate_release.outputs.release-version }}\\\`\"
                }
              }
            ]
          }"
          
          # Send notification to Slack
          curl -X POST -H 'Content-type: application/json' \
            --data "$SLACK_MESSAGE" \
            ${{ secrets.SLACK_WEBHOOK }}
          
          echo "✅ Slack notification sent successfully"
      
      - name: "📝 Update Release Status and Documentation"
        run: |
          echo "📝 Updating release status and documentation..."
          
          # Log release completion
          echo "Release v${{ needs.validate_release.outputs.release-version }} completed successfully"
          echo "Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "Workflow run: ${{ github.run_id }}"
          echo "Actor: ${{ github.actor }}"
          echo "Repository: ${{ github.repository }}"
          
          # Create release completion marker
          echo "✅ Release workflow completed successfully"
          echo "🎉 Node.js Tutorial Application v${{ needs.validate_release.outputs.release-version }} is now available!"
          echo ""
          echo "📋 Next Steps:"
          echo "  1. Monitor application performance in deployed environments"
          echo "  2. Update documentation if necessary"
          echo "  3. Communicate release to stakeholders"
          echo "  4. Plan next development iteration"
          
          echo "✅ Release status updated successfully"
      
      - name: "🎉 Final Release Success Notification"
        run: |
          echo ""
          echo "🎉 RELEASE WORKFLOW COMPLETED SUCCESSFULLY! 🎉"
          echo "=============================================="
          echo ""
          echo "✨ Node.js Tutorial Application Release Summary ✨"
          echo ""
          echo "🎯 Version: ${{ needs.validate_release.outputs.release-version }}"
          echo "📦 Type: $(if [[ '${{ needs.validate_release.outputs.is-prerelease }}' == 'true' ]]; then echo 'Pre-release'; else echo 'Stable Release'; fi)"
          echo "🌍 Deployments: $(if [[ '${{ needs.deploy_production.result }}' == 'success' ]]; then echo 'Production ✅'; elif [[ '${{ needs.deploy_staging.result }}' == 'success' ]]; then echo 'Staging ✅'; else echo 'None'; fi)"
          echo "🔗 Release URL: ${{ needs.create_release.outputs.release-url }}"
          echo "🐳 Container: ${{ env.IMAGE_NAME }}:${{ needs.validate_release.outputs.release-version }}"
          echo ""
          echo "🚀 The Node.js Tutorial Application has been successfully released!"
          echo "Thank you for using our automated release pipeline! 🙏"
          echo ""